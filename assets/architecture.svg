<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Arquitetura do GeRelat</title>

  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00488D" />
      <stop offset="100%" stop-color="#1A6CFF" />
    </linearGradient>

    <marker id="arrowEnd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0054D3" />
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="428" rx="22" fill="#F7F9FB" stroke="#DFE3E8" />

  <!-- Frontend <-> Backend connection -->
  <line x1="450" y1="100" x2="372" y2="100" stroke="#0054D3" stroke-width="2.5" marker-end="url(#arrowEnd)" />
  <line x1="450" y1="100" x2="528" y2="100" stroke="#0054D3" stroke-width="2.5" marker-end="url(#arrowEnd)" />
  <rect x="380" y="88" width="140" height="24" rx="12" fill="#F7F9FB" />
  <text x="450" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#0054D3">HTTP / JWT</text>

  <!-- Fan-out connectors: backend -> services -->
  <path d="M 680 150 C 680 210, 160 210, 160 270" fill="none" stroke="#B9CCF0" stroke-width="2" />
  <path d="M 680 150 C 680 210, 450 210, 450 270" fill="none" stroke="#B9CCF0" stroke-width="2" />
  <path d="M 680 150 C 680 210, 740 210, 740 270" fill="none" stroke="#B9CCF0" stroke-width="2" />

  <!-- Redis <-> Celery -->
  <line x1="577" y1="325" x2="613" y2="325" stroke="#0054D3" stroke-width="2.5" marker-end="url(#arrowEnd)" marker-start="url(#arrowEnd)" />

  <!-- Frontend card -->
  <rect x="70" y="50" width="300" height="100" rx="16" fill="url(#brandGrad)" />
  <text x="220" y="94" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">gerelat_frontend</text>
  <text x="220" y="118" text-anchor="middle" font-size="13" fill="#D9E6FF">Flutter Web</text>

  <!-- Backend card -->
  <rect x="530" y="50" width="300" height="100" rx="16" fill="url(#brandGrad)" />
  <text x="680" y="94" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">gerelat-api</text>
  <text x="680" y="118" text-anchor="middle" font-size="13" fill="#D9E6FF">Django + DRF</text>

  <!-- PostgreSQL card -->
  <g>
    <rect x="35" y="270" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#DDE3EE" stroke-width="1.5" />
    <rect x="35" y="270" width="250" height="6" rx="3" fill="#336791" />
    <text x="160" y="316" text-anchor="middle" font-size="17" font-weight="700" fill="#191C1E">PostgreSQL</text>
    <text x="160" y="338" text-anchor="middle" font-size="12.5" fill="#6D727E">dados</text>
  </g>

  <!-- Redis card -->
  <g>
    <rect x="325" y="270" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#DDE3EE" stroke-width="1.5" />
    <rect x="325" y="270" width="250" height="6" rx="3" fill="#DC382D" />
    <text x="450" y="316" text-anchor="middle" font-size="17" font-weight="700" fill="#191C1E">Redis</text>
    <text x="450" y="338" text-anchor="middle" font-size="12.5" fill="#6D727E">broker / cache</text>
  </g>

  <!-- Celery card -->
  <g>
    <rect x="615" y="270" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#DDE3EE" stroke-width="1.5" />
    <rect x="615" y="270" width="250" height="6" rx="3" fill="#2FA84F" />
    <text x="740" y="316" text-anchor="middle" font-size="17" font-weight="700" fill="#191C1E">Celery</text>
    <text x="740" y="338" text-anchor="middle" font-size="12.5" fill="#6D727E">worker + beat</text>
    <text x="740" y="358" text-anchor="middle" font-size="11.5" fill="#8A8F9C">relatórios e agendamentos</text>
  </g>
</svg>
